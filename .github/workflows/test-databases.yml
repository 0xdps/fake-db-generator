name: Test Database Support

# Manual trigger only - run on demand to test all database integrations
on:
  workflow_dispatch:
    inputs:
      test_mysql:
        description: 'Test MySQL'
        required: false
        default: true
        type: boolean
      test_mariadb:
        description: 'Test MariaDB'
        required: false
        default: true
        type: boolean
      test_postgres:
        description: 'Test PostgreSQL'
        required: false
        default: true
        type: boolean
      test_sqlite:
        description: 'Test SQLite'
        required: false
        default: true
        type: boolean
      test_mssql:
        description: 'Test MS SQL Server'
        required: false
        default: true
        type: boolean
      test_cockroachdb:
        description: 'Test CockroachDB'
        required: false
        default: true
        type: boolean

jobs:
  test-mysql:
    name: Test MySQL
    runs-on: ubuntu-latest
    if: github.event.inputs.test_mysql == 'true'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "mysql",
              "username": "root",
              "password": "testpass",
              "host": "127.0.0.1:3306",
              "database": "testdb"
            },
            "tables": [
              {
                "name": "users",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}, "options": {"nullable": false}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}, "options": {"nullable": false}}
                ]
              }
            ],
            "populate": [
              {
                "name": "users",
                "count": 10,
                "fields": [
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          COUNT=$(mysql -h 127.0.0.1 -u root -ptestpass testdb -N -s -e "SELECT COUNT(*) FROM users;")
          echo "Found $COUNT rows"
          [ "$COUNT" -eq 10 ] && echo "✅ MySQL test passed"

  test-mariadb:
    name: Test MariaDB
    runs-on: ubuntu-latest
    if: github.event.inputs.test_mariadb == 'true'
    
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "mariadb",
              "username": "root",
              "password": "testpass",
              "host": "127.0.0.1:3306",
              "database": "testdb"
            },
            "tables": [
              {
                "name": "users",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}, "options": {"nullable": false}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}, "options": {"nullable": false}}
                ]
              }
            ],
            "populate": [
              {
                "name": "users",
                "count": 10,
                "fields": [
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          COUNT=$(mysql -h 127.0.0.1 -u root -ptestpass testdb -N -s -e "SELECT COUNT(*) FROM users;")
          echo "Found $COUNT rows"
          [ "$COUNT" -eq 10 ] && echo "✅ MariaDB test passed"

  test-postgres:
    name: Test PostgreSQL
    runs-on: ubuntu-latest
    if: github.event.inputs.test_postgres == 'true'
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "psql",
              "username": "postgres",
              "password": "testpass",
              "host": "localhost:5432",
              "database": "testdb"
            },
            "tables": [
              {
                "name": "users",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}, "options": {"nullable": false}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}, "options": {"nullable": false}}
                ]
              }
            ],
            "populate": [
              {
                "name": "users",
                "count": 10,
                "fields": [
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          COUNT=$(PGPASSWORD=testpass psql -h localhost -U postgres testdb -t -c "SELECT COUNT(*) FROM users;" | xargs)
          echo "Found $COUNT rows"
          [ "$COUNT" -eq 10 ] && echo "✅ PostgreSQL test passed"

  test-sqlite:
    name: Test SQLite
    runs-on: ubuntu-latest
    if: github.event.inputs.test_sqlite == 'true'

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "sqlite",
              "database": "test.db"
            },
            "tables": [
              {
                "name": "users",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}, "options": {"nullable": false}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}, "options": {"nullable": false}}
                ]
              }
            ],
            "populate": [
              {
                "name": "users",
                "count": 10,
                "fields": [
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          COUNT=$(sqlite3 test.db "SELECT COUNT(*) FROM users;")
          echo "Found $COUNT rows"
          [ "$COUNT" -eq 10 ] && echo "✅ SQLite test passed"

  test-mssql:
    name: Test MS SQL Server
    runs-on: ubuntu-latest
    if: github.event.inputs.test_mssql == 'true'
    
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPass123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Wait for MSSQL
        run: sleep 30
      
      - name: Setup database
        run: |
          docker exec $(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest) \
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' \
            -Q "CREATE DATABASE testdb;"
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "mssql",
              "username": "sa",
              "password": "TestPass123!",
              "host": "localhost:1433",
              "database": "testdb"
            },
            "tables": [
              {
                "name": "users",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}, "options": {"nullable": false}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}, "options": {"nullable": false}}
                ]
              }
            ],
            "populate": [
              {
                "name": "users",
                "count": 10,
                "fields": [
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          COUNT=$(docker exec $(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest) \
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -d testdb -h -1 \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM users;" | xargs)
          echo "Found $COUNT rows"
          [ "$COUNT" -eq 10 ] && echo "✅ MSSQL test passed"

  test-cockroachdb:
    name: Test CockroachDB
    runs-on: ubuntu-latest
    if: github.event.inputs.test_cockroachdb == 'true'

    steps:
      - uses: actions/checkout@v4
      
      - name: Start CockroachDB
        run: |
          docker run -d --name cockroach \
            -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:latest start-single-node --insecure
          sleep 10
      
      - name: Setup database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD='' psql -h localhost -p 26257 -U root -c "CREATE DATABASE testdb;"
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "cockroachdb",
              "username": "root",
              "password": "",
              "host": "localhost:26257",
              "database": "testdb"
            },
            "tables": [
              {
                "name": "users",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}, "options": {"nullable": false}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}, "options": {"nullable": false}}
                ]
              }
            ],
            "populate": [
              {
                "name": "users",
                "count": 10,
                "fields": [
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          COUNT=$(PGPASSWORD='' psql -h localhost -p 26257 -U root testdb -t -c "SELECT COUNT(*) FROM users;" | xargs)
          echo "Found $COUNT rows"
          [ "$COUNT" -eq 10 ] && echo "✅ CockroachDB test passed"

  summary:
    name: Test Summary
    needs: [test-mysql, test-mariadb, test-postgres, test-sqlite, test-mssql, test-cockroachdb]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "🎯 Database Testing Complete"
          echo "=============================="
          echo "Selected databases:"
          echo "  MySQL: ${{ github.event.inputs.test_mysql == 'true' && needs.test-mysql.result || 'skipped' }}"
          echo "  MariaDB: ${{ github.event.inputs.test_mariadb == 'true' && needs.test-mariadb.result || 'skipped' }}"
          echo "  PostgreSQL: ${{ github.event.inputs.test_postgres == 'true' && needs.test-postgres.result || 'skipped' }}"
          echo "  SQLite: ${{ github.event.inputs.test_sqlite == 'true' && needs.test-sqlite.result || 'skipped' }}"
          echo "  MSSQL: ${{ github.event.inputs.test_mssql == 'true' && needs.test-mssql.result || 'skipped' }}"
          echo "  CockroachDB: ${{ github.event.inputs.test_cockroachdb == 'true' && needs.test-cockroachdb.result || 'skipped' }}"
