name: Test Database Support

# Manual trigger only - run on demand to test all database integrations
on:
  workflow_dispatch:
    inputs:
      test_mysql:
        description: 'Test MySQL'
        required: false
        default: true
        type: boolean
      test_mariadb:
        description: 'Test MariaDB'
        required: false
        default: true
        type: boolean
      test_postgres:
        description: 'Test PostgreSQL'
        required: false
        default: true
        type: boolean
      test_sqlite:
        description: 'Test SQLite'
        required: false
        default: true
        type: boolean
      test_mssql:
        description: 'Test MS SQL Server'
        required: false
        default: true
        type: boolean
      test_cockroachdb:
        description: 'Test CockroachDB'
        required: false
        default: true
        type: boolean

jobs:
  test-mysql:
    name: Test MySQL
    runs-on: ubuntu-latest
    if: github.event.inputs.test_mysql == 'true'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: golang/go.sum
      
      - name: Build fakestack
        working-directory: golang
        run: |
          CGO_ENABLED=1 go build -o ../bin/fakestack-test
          chmod +x ../bin/fakestack-test
      
      - name: Create test schema
        run: |
          cat > test-schema.json << 'EOF'
          {
            "database": {
              "dbtype": "mysql",
              "username": "root",
              "password": "testpass",
              "host": "127.0.0.1:3306",
              "database": "testdb"
            },
            "tables": [
              {
                "name": "comprehensive_test",
                "columns": [
                  {"name": "id", "type": "integer", "options": {"primary_key": true, "autoincrement": true}},
                  {"name": "first_name", "type": {"name": "string", "args": {"length": 50}}},
                  {"name": "last_name", "type": {"name": "string", "args": {"length": 50}}},
                  {"name": "full_name", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "username", "type": {"name": "string", "args": {"length": 50}}},
                  {"name": "email", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "password", "type": {"name": "string", "args": {"length": 255}}},
                  {"name": "gender", "type": {"name": "string", "args": {"length": 20}}},
                  {"name": "address", "type": {"name": "string", "args": {"length": 255}}},
                  {"name": "street_address", "type": {"name": "string", "args": {"length": 255}}},
                  {"name": "city", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "state", "type": {"name": "string", "args": {"length": 50}}},
                  {"name": "country", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "postcode", "type": {"name": "string", "args": {"length": 20}}},
                  {"name": "latitude", "type": "float"},
                  {"name": "longitude", "type": "float"},
                  {"name": "company", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "job_title", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "phone", "type": {"name": "string", "args": {"length": 30}}},
                  {"name": "url", "type": {"name": "string", "args": {"length": 255}}},
                  {"name": "domain", "type": {"name": "string", "args": {"length": 100}}},
                  {"name": "ipv4", "type": {"name": "string", "args": {"length": 15}}},
                  {"name": "ipv6", "type": {"name": "string", "args": {"length": 45}}},
                  {"name": "mac_address", "type": {"name": "string", "args": {"length": 17}}},
                  {"name": "date_field", "type": "date"},
                  {"name": "past_date", "type": "date"},
                  {"name": "future_date", "type": "date"},
                  {"name": "word", "type": {"name": "string", "args": {"length": 50}}},
                  {"name": "sentence", "type": {"name": "string", "args": {"length": 255}}},
                  {"name": "paragraph", "type": "text"},
                  {"name": "random_int", "type": "integer"},
                  {"name": "salary", "type": "float"},
                  {"name": "price", "type": "float"},
                  {"name": "is_active", "type": "boolean"},
                  {"name": "uuid", "type": {"name": "string", "args": {"length": 36}}},
                  {"name": "status", "type": {"name": "string", "args": {"length": 20}}},
                  {"name": "priority", "type": {"name": "string", "args": {"length": 20}}}
                ]
              }
            ],
            "populate": [
              {
                "name": "comprehensive_test",
                "count": 10,
                "fields": [
                  {"name": "first_name", "generator": "first_name"},
                  {"name": "last_name", "generator": "last_name"},
                  {"name": "full_name", "generator": "name"},
                  {"name": "username", "generator": "user_name"},
                  {"name": "email", "generator": "email"},
                  {"name": "password", "generator": "password"},
                  {"name": "gender", "generator": "gender"},
                  {"name": "address", "generator": "address"},
                  {"name": "street_address", "generator": "street_address"},
                  {"name": "city", "generator": "city"},
                  {"name": "state", "generator": "state"},
                  {"name": "country", "generator": "country"},
                  {"name": "postcode", "generator": "postcode"},
                  {"name": "latitude", "generator": "latitude"},
                  {"name": "longitude", "generator": "longitude"},
                  {"name": "company", "generator": "company"},
                  {"name": "job_title", "generator": "job"},
                  {"name": "phone", "generator": "phone_number"},
                  {"name": "url", "generator": "url"},
                  {"name": "domain", "generator": "domain_name"},
                  {"name": "ipv4", "generator": "ipv4"},
                  {"name": "ipv6", "generator": "ipv6"},
                  {"name": "mac_address", "generator": "mac_address"},
                  {"name": "date_field", "generator": "date"},
                  {"name": "past_date", "generator": "past_date"},
                  {"name": "future_date", "generator": "future_date"},
                  {"name": "word", "generator": "word"},
                  {"name": "sentence", "generator": "sentence"},
                  {"name": "paragraph", "generator": "paragraph"},
                  {"name": "random_int", "generator": "random_int", "args": {"min": 1, "max": 1000}},
                  {"name": "salary", "generator": "float", "args": {"min": 30000.0, "max": 150000.0}},
                  {"name": "price", "generator": "decimal", "args": {"min": 9.99, "max": 999.99}},
                  {"name": "is_active", "generator": "boolean"},
                  {"name": "uuid", "generator": "uuid"},
                  {"name": "status", "generator": "random_from", "args": ["active", "inactive", "pending", "suspended"]},
                  {"name": "priority", "generator": "random_from", "args": ["low", "medium", "high", "urgent"]}
                ]
              }
            ]
          }
          EOF
      
      - name: Test create and populate
        run: |
          ./bin/fakestack-test -c -f test-schema.json
          ./bin/fakestack-test -p -f test-schema.json
      
      - name: Verify data
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          COUNT=$(mysql -h 127.0.0.1 -u root -ptestpass testdb -N -s -e "SELECT COUNT(*) FROM comprehensive_test;")
          echo "Found $COUNT rows in comprehensive_test"
          [ "$COUNT" -eq 10 ] && echo "✅ MySQL test passed - all generators working!"

