name: Test & Build

on:
  push:
    branches: [ trunk, main, develop ]
  pull_request:
    branches: [ trunk, main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install -e .
        pip install -e ".[dev]"
        
    - name: Lint with flake8
      run: |
        flake8 schemer --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 schemer --count --exit-zero --max-complexity=10 --max-line-length=135 --extend-ignore=E203,F401 --statistics
        
    - name: Check formatting with black
      run: |
        black --check schemer/
        
    - name: Check import sorting with isort
      run: |
        isort --check-only schemer/
        
    - name: Type checking with mypy
      run: |
        mypy schemer/ --ignore-missing-imports || true
        
    - name: Test with pytest
      run: |
        pytest tests/ --cov=schemer --cov-report=xml --cov-report=term
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [[ "${{ needs.test.result }}" == "failure" ]]; then
          echo "❌ Some test jobs failed"
          exit 1
        elif [[ "${{ needs.test.result }}" == "cancelled" ]]; then
          echo "⏹️ Test jobs were cancelled"
          exit 1
        else
          echo "✅ All test jobs passed successfully"
        fi
