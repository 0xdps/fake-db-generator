name: Publish Packages

on:
  release:
    types: [published]

jobs:
  # Build Go binaries for all platforms
  build-binaries:
    name: Build Go Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-latest
          - platform: darwin-amd64
            runner: macos-15
          - platform: darwin-arm64
            runner: macos-latest
          - platform: windows-amd64
            runner: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache-dependency-path: golang/go.sum
    
    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.platform == 'linux-arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
    
    - name: Build binary
      working-directory: golang
      shell: bash
      env:
        CGO_ENABLED: 1
      run: |
        if [ "${{ matrix.platform }}" = "linux-arm64" ]; then
          export CC=aarch64-linux-gnu-gcc
          export GOOS=linux
          export GOARCH=arm64
        fi
        
        OUTPUT="../bin/fakestack-${{ matrix.platform }}"
        if [[ "${{ matrix.platform }}" == *"windows"* ]]; then
          OUTPUT="${OUTPUT}.exe"
        fi
        
        mkdir -p ../bin
        go build -ldflags="-s -w" -o "$OUTPUT"
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.platform }}
        path: bin/fakestack-*
        retention-days: 90
  
  # Merge all binaries into one artifact
  merge-binaries:
    name: Merge All Binaries
    runs-on: ubuntu-latest
    needs: build-binaries
    
    steps:
    - name: Download all binaries
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        path: bin
        merge-multiple: true
    
    - name: Upload merged binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: bin/fakestack-*
        retention-days: 90

  # Publish to PyPI
  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: merge-binaries
    environment: 
      name: pypi
      url: https://pypi.org/p/fakestack
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: python/fakestack/bin
    
    - name: Make binaries executable
      run: chmod +x python/fakestack/bin/*

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install build twine

    - name: Verify version matches tag
      working-directory: python
      run: |
        PACKAGE_VERSION=$(python -c "import fakestack; print(fakestack.__version__)")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: Package is $PACKAGE_VERSION but tag is $TAG_VERSION"
          exit 1
        fi
        echo "✅ Version matches tag"

    - name: Install and test
      working-directory: python
      run: |
        pip install -e ".[dev]"
        pytest tests/ -v
        flake8 fakestack --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check fakestack/
        isort --check-only fakestack/
        python -m fakestack.runner -d .
        python -m fakestack.runner -c -p -f schema.json

    - name: Build package
      working-directory: python
      run: |
        rm -rf build/ dist/ *.egg-info/
        python -m build

    - name: Validate package
      working-directory: python
      run: |
        python -m twine check dist/*
        pip install dist/*.whl
        python -c "import fakestack; print(f'✅ Successfully installed v{fakestack.__version__}')"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist/
        print-hash: true
        verbose: true

  # Publish to npm
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: merge-binaries
    environment:
      name: npm
      url: https://www.npmjs.com/package/fakestack
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: node/bin
    
    - name: Make binaries executable
      run: chmod +x node/bin/*
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      working-directory: node
      run: npm ci
    
    - name: Build TypeScript
      working-directory: node
      run: npm run build
    
    - name: Verify version matches tag
      working-directory: node
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: Package is $PACKAGE_VERSION but tag is $TAG_VERSION"
          exit 1
        fi
        echo "✅ Version matches tag"
    
    - name: Test package
      working-directory: node
      shell: bash
      run: |
        node dist/cli.js -d .
        node dist/cli.js -c -p -f schema.json
    
    - name: Publish to npm
      working-directory: node
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create GitHub Release with binaries
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: merge-binaries
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: binaries
    
    - name: Create checksums
      working-directory: binaries
      run: |
        sha256sum * > SHA256SUMS
        cat SHA256SUMS
    
    - name: Upload binaries to release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          binaries/fakestack-*
          binaries/SHA256SUMS
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update Homebrew tap
  publish-homebrew:
    name: Publish to Homebrew
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries for checksums
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: binaries
    
    - name: Calculate SHA256 checksums
      id: checksums
      run: |
        echo "darwin_arm64=$(sha256sum binaries/fakestack-darwin-arm64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "darwin_amd64=$(sha256sum binaries/fakestack-darwin-amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "linux_arm64=$(sha256sum binaries/fakestack-linux-arm64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "linux_amd64=$(sha256sum binaries/fakestack-linux-amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
    
    - name: Update Homebrew formula
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        
        # Create Formula directory if it doesn't exist
        mkdir -p golang/Formula
        
        # Copy and update formula
        cp golang/homebrew/fakestack.rb golang/Formula/fakestack.rb
        
        # Update version
        sed -i "s/version \".*\"/version \"${TAG_VERSION}\"/" golang/Formula/fakestack.rb
        
        # Update SHA256 checksums
        sed -i "s/sha256 \"\" # darwin-arm64/sha256 \"${{ steps.checksums.outputs.darwin_arm64 }}\"/" golang/Formula/fakestack.rb
        sed -i "s/sha256 \"\" # darwin-amd64/sha256 \"${{ steps.checksums.outputs.darwin_amd64 }}\"/" golang/Formula/fakestack.rb
        sed -i "s/sha256 \"\" # linux-arm64/sha256 \"${{ steps.checksums.outputs.linux_arm64 }}\"/" golang/Formula/fakestack.rb
        sed -i "s/sha256 \"\" # linux-amd64/sha256 \"${{ steps.checksums.outputs.linux_amd64 }}\"/" golang/Formula/fakestack.rb
        
        cat golang/Formula/fakestack.rb
    
    - name: Commit and push to homebrew tap
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add golang/Formula/fakestack.rb
        git commit -m "chore: update Homebrew formula to ${GITHUB_REF#refs/tags/}"
        git push origin trunk || echo "⚠️  Formula update failed, manual update needed"
