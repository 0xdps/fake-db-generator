name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA to publish'
        required: true
        type: string
      skip_npm:
        description: 'Skip npm publish'
        required: false
        type: boolean
        default: false
      skip_pypi:
        description: 'Skip PyPI publish'
        required: false
        type: boolean
        default: false
      skip_github_packages:
        description: 'Skip GitHub Packages publish'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Extract and validate version
        id: get_version
        run: |
          # Extract version from tag
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref }}"
            TAG_VERSION="${REF#refs/tags/}"
          else
            TAG_VERSION="${{ inputs.tag }}"
          fi
          
          VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          # Get current package.json version
          NODE_VERSION=$(node -p "require('./node/package.json').version")
          
          # Get Python version
          PYTHON_VERSION=$(grep -oP '__version__ = "\K[^"]+' python/fakestack/__init__.py)
          
          echo "🏷️  Git tag version: $VERSION"
          echo "📦 Node package.json version: $NODE_VERSION"
          echo "🐍 Python __init__.py version: $PYTHON_VERSION"
          
          # Validate versions match
          if [ "$VERSION" != "$NODE_VERSION" ] || [ "$VERSION" != "$PYTHON_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag: $TAG_VERSION ($VERSION)"
            echo "   Node package.json: $NODE_VERSION"
            echo "   Python __init__.py: $PYTHON_VERSION"
            echo ""
            echo "💡 Please ensure all versions match the git tag before publishing."
            exit 1
          fi
          
          echo "✅ Version consistency validated: $VERSION"

  # Build Go binaries for all platforms
  build-binaries:
    name: Build Go Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-latest
          - platform: darwin-amd64
            runner: macos-15
          - platform: darwin-arm64
            runner: macos-latest
          - platform: windows-amd64
            runner: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache-dependency-path: go.sum
    
    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.platform == 'linux-arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
    
    - name: Build binary
      shell: bash
      env:
        CGO_ENABLED: 1
      run: |
        if [ "${{ matrix.platform }}" = "linux-arm64" ]; then
          export CC=aarch64-linux-gnu-gcc
          export GOOS=linux
          export GOARCH=arm64
        fi
        
        OUTPUT="bin/fakestack-${{ matrix.platform }}"
        if [[ "${{ matrix.platform }}" == *"windows"* ]]; then
          OUTPUT="${OUTPUT}.exe"
        fi
        
        mkdir -p bin
        VERSION="${{ needs.validate.outputs.version }}"
        cd golang && go build -ldflags="-s -w -X main.Version=${VERSION}" -o "../$OUTPUT"
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.platform }}
        path: bin/fakestack-*
        retention-days: 90
  
  # Merge all binaries into one artifact
  merge-binaries:
    name: Merge All Binaries
    runs-on: ubuntu-latest
    needs: build-binaries
    
    steps:
    - name: Download all binaries
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        path: bin
        merge-multiple: true
    
    - name: Upload merged binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: bin/fakestack-*
        retention-days: 90

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate, merge-binaries]
    if: inputs.skip_pypi != true
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: python/fakestack/bin
    
    - name: Make binaries executable
      run: chmod +x python/fakestack/bin/*

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install build twine

    - name: Verify version matches tag
      working-directory: python
      run: |
        PACKAGE_VERSION=$(python -c "import fakestack; print(fakestack.__version__)")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: Package is $PACKAGE_VERSION but tag is $TAG_VERSION"
          exit 1
        fi
        echo "✅ Version matches tag"

    - name: Install and test
      working-directory: python
      run: |
        pip install -e ".[dev]"
        pytest tests/ -v
        flake8 fakestack --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check fakestack/
        isort --check-only fakestack/
        python -m fakestack.runner -d .
        python -m fakestack.runner -c -p -f schema.json

    - name: Build package
      working-directory: python
      run: |
        rm -rf build/ dist/ *.egg-info/
        python -m build

    - name: Validate package
      working-directory: python
      run: |
        python -m twine check dist/*
        pip install dist/*.whl
        python -c "import fakestack; print(f'✅ Successfully installed v{fakestack.__version__}')"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist/
        print-hash: true
        verbose: true

  # Publish to npm
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [validate, merge-binaries]
    if: inputs.skip_npm != true
    permissions:
      contents: read
      id-token: write  # Required for provenance
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit_sha || github.sha }}
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: node/bin
    
    - name: Make binaries executable
      run: chmod +x node/bin/*
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
        cache-dependency-path: node/package-lock.json
    
    - name: Install dependencies
      working-directory: node
      run: npm ci
    
    - name: Build TypeScript
      working-directory: node
      run: npm run build
    
    - name: Test package
      working-directory: node
      shell: bash
      run: |
        node dist/cli.js -d .
        node dist/cli.js -c -p -f schema.json
    
    - name: Publish to npm
      working-directory: node
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish to GitHub Packages
  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [validate, merge-binaries]
    if: inputs.skip_github_packages != true
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: node/bin
      
      - name: Make binaries executable
        run: chmod +x node/bin/*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        working-directory: node
        run: npm ci

      - name: Build TypeScript
        working-directory: node
        run: npm run build

      - name: Publish to GitHub Packages (scoped)
        working-directory: node
        run: |
          # Save current name and registry
          ORIGINAL_NAME=$(npm pkg get name | tr -d '"')
          ORIGINAL_REGISTRY=$(npm pkg get publishConfig.registry | tr -d '"')

          # Set scoped name and GitHub registry
          npm pkg set name="@${{ github.repository_owner }}/$ORIGINAL_NAME"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

          # Publish to GitHub Packages
          npm publish --registry=https://npm.pkg.github.com

          # Revert name and registry for next publish
          npm pkg set name="$ORIGINAL_NAME"
          if [ "$ORIGINAL_REGISTRY" != "null" ]; then
            npm pkg set publishConfig.registry="$ORIGINAL_REGISTRY"
          else
            npm pkg delete publishConfig.registry
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create GitHub Release with binaries
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, merge-binaries, publish-npm, publish-pypi, publish-github-packages]
    if: always() && !cancelled() && needs.merge-binaries.result == 'success'
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit_sha || github.sha }}
    
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: binaries
    
    - name: Create checksums
      working-directory: binaries
      run: |
        sha256sum * > SHA256SUMS
        cat SHA256SUMS
    
    - name: Generate release notes
      id: release_notes
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        
        cat > release_notes.md << 'EOF'
        ## Installation
        
        ### npm
        ```bash
        npm install -g fakestack
        ```
        
        ### pip
        ```bash
        pip install fakestack
        ```
        
        ### Homebrew (macOS/Linux)
        ```bash
        brew install 0xdps/tap/fakestack
        ```
        
        ### Go
        ```bash
        go install github.com/0xdps/fake-stack/golang/cmd/fakestack@v${TAG_VERSION}
        ```
        
        ### Direct Download
        Download the appropriate binary for your platform from the assets below and add it to your PATH.
        
        ## What's Changed
        See [CHANGELOG.md](https://github.com/0xdps/fake-stack/blob/trunk/CHANGELOG.md#v${TAG_VERSION//.}) for details.
        
        ## Documentation
        📖 [Read the Docs](https://fake-stack.readthedocs.io/)
        
        ## Verification
        All binaries include SHA256 checksums (see `SHA256SUMS` in assets).
        EOF
        
        cat release_notes.md
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          binaries/fakestack-*
          binaries/SHA256SUMS
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update Homebrew tap
  publish-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [validate, create-release]
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries for checksums
      uses: actions/download-artifact@v4
      with:
        name: binaries
        path: binaries
    
    - name: Calculate SHA256 checksums
      id: checksums
      run: |
        echo "darwin_arm64=$(sha256sum binaries/fakestack-darwin-arm64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "darwin_amd64=$(sha256sum binaries/fakestack-darwin-amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "linux_arm64=$(sha256sum binaries/fakestack-linux-arm64 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "linux_amd64=$(sha256sum binaries/fakestack-linux-amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
    
    - name: Clone homebrew-fakestack tap
      run: |
        git clone https://github.com/0xdps/homebrew-fakestack.git tap
    
    - name: Update Homebrew formula
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        
        # Create Formula directory if it doesn't exist
        mkdir -p tap/Formula
        
        # Copy and update formula
        cp golang/homebrew/fakestack.rb tap/Formula/fakestack.rb
        
        # Update version
        sed -i "s/version \".*\"/version \"${TAG_VERSION}\"/" tap/Formula/fakestack.rb
        
        # Update SHA256 checksums
        sed -i "s/sha256 \"\" # darwin-arm64/sha256 \"${{ steps.checksums.outputs.darwin_arm64 }}\"/" tap/Formula/fakestack.rb
        sed -i "s/sha256 \"\" # darwin-amd64/sha256 \"${{ steps.checksums.outputs.darwin_amd64 }}\"/" tap/Formula/fakestack.rb
        sed -i "s/sha256 \"\" # linux-arm64/sha256 \"${{ steps.checksums.outputs.linux_arm64 }}\"/" tap/Formula/fakestack.rb
        sed -i "s/sha256 \"\" # linux-amd64/sha256 \"${{ steps.checksums.outputs.linux_amd64 }}\"/" tap/Formula/fakestack.rb
        
        cat tap/Formula/fakestack.rb
    
    - name: Push to homebrew-fakestack tap
      working-directory: tap
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/fakestack.rb
        git commit -m "chore: update formula to ${GITHUB_REF#refs/tags/}"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/0xdps/homebrew-fakestack.git main || echo "⚠️  Formula update failed, manual update needed"
