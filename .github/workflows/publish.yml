name: Publish Packages

on:
  release:
    types: [published]

jobs:
  # Build Go binaries for all platforms
  build-binaries:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build all binaries
      run: ./scripts/build.sh
    
    - name: Upload binaries
      uses: actions/upload-artifact@v3
      with:
        name: binaries
        path: bin/fakestack-*
        retention-days: 90

  # Publish to PyPI
  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-binaries
    environment: 
      name: pypi
      url: https://pypi.org/p/fakestack
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v3
      with:
        name: binaries
        path: python/fakestack/bin
    
    - name: Make binaries executable
      run: chmod +x python/fakestack/bin/*

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install build twine

    - name: Verify version matches tag
      run: |
        PACKAGE_VERSION=$(python -c "import fakestack; print(fakestack.__version__)")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: Package is $PACKAGE_VERSION but tag is $TAG_VERSION"
          exit 1
        fi
        echo "✅ Version matches tag"

    - name: Install and test
      run: |
        cd python && pip install -e ".[dev]"
        pytest tests/ -v
        flake8 fakestack --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check fakestack/
        isort --check-only fakestack/
        python -m fakestack.runner -d .
        python -m fakestack.runner -c -p -f schema.json

    - name: Build package
      working-directory: python
      run: |
        rm -rf build/ dist/ *.egg-info/
        python -m build

    - name: Validate package
      working-directory: python
      run: |
        python -m twine check dist/*
        pip install dist/*.whl
        python -c "import fakestack; print(f'✅ Successfully installed v{fakestack.__version__}')"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist/
        print-hash: true
        verbose: true

  # Publish to npm
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-binaries
    environment:
      name: npm
      url: https://www.npmjs.com/package/fakestack
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download binaries
      uses: actions/download-artifact@v3
      with:
        name: binaries
        path: node/bin
    
    - name: Make binaries executable
      run: chmod +x node/bin/*
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      working-directory: node
      run: npm ci
    
    - name: Build TypeScript
      working-directory: node
      run: npm run build
    
    - name: Verify version matches tag
      working-directory: node
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: Package is $PACKAGE_VERSION but tag is $TAG_VERSION"
          exit 1
        fi
        echo "✅ Version matches tag"
    
    - name: Test package
      working-directory: node
      run: |
        node dist/cli.js -d .
        node dist/cli.js -c -p -f schema.json
    
    - name: Publish to npm
      working-directory: node
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
