# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install -r docs/requirements.txt
    - |
      if [ -z "$READTHEDOCS_VERSION" ] || [ "$READTHEDOCS_VERSION" = "latest" ]; then
        mike deploy --push --update-aliases stable latest
      else
        mike deploy --push --update-aliases $READTHEDOCS_VERSION latest
      fi

python:
  install:
    - requirements: docs/requirements.txt

mkdocs:
  configuration: docs/mkdocs.yml
  fail_on_warning: false
