site_name: Fakestack Documentation
site_url: https://fakestack.readthedocs.io
site_description: Generate realistic fake data and populate databases with ease
site_author: 0xdps
repo_url: https://github.com/0xdps/fake-stack
repo_name: 0xdps/fake-stack
edit_uri: edit/trunk/docs/

docs_dir: .

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Reference:
      - Schema Reference: schema-reference.md
      - Data Generators: generators.md
      - Database Support: databases.md
      - API Reference: api-reference.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - offline

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/0xdps/fake-stack
      name: GitHub Repository
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fakestack/
      name: PyPI Package
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/fakestack
      name: npm Package
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2025 0xdps
